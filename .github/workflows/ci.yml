name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run the pre-publish checks
        run: bash scripts/verify.sh
      # cargo package extracts this crate under target/package, including tests/.
      # rust-cache treats every directory named tests as a trybuild workspace and
      # logs ENOENT when tests/target and tests/trybuild are absent.
      - name: Drop packaged sources before the cache is saved
        if: always()
        run: rm -rf target/package
