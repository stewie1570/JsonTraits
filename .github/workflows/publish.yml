name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the tag to match Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$tag" != "$version" ]]; then
            echo "Tag v${tag} does not match crate version ${version}." >&2
            echo "Cargo.toml and the git tag must both say ${version}." >&2
            exit 1
          fi

  publish:
    name: Publish to crates.io
    needs: [verify, version]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            unset CARGO_REGISTRY_TOKEN
          fi
          cargo publish
      - name: Drop packaged sources before the cache is saved
        if: always()
        run: rm -rf target/package
